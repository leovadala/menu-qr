<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Menú digital para consultar desde el celular.">
  <title>Menú</title>
  <link rel="preload" as="image" href="assets/menu-portada.jpg">
  <link rel="preload" as="image" href="assets/Salado.jpg">
  <link rel="preload" as="image" href="assets/dulce.jpg">
  <link rel="preload" as="image" href="assets/con%20helado%20foto.jpg">
  <link rel="preload" as="image" href="assets/con%20helado.jpg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="menu" aria-label="Menú de cinco páginas">
    <div class="pages" id="pages" tabindex="0" aria-label="Deslizá horizontalmente para ver el menú">
      <section class="page" aria-label="Página 1 de 5: Portada">
        <img src="assets/menu-portada.jpg" alt="Portada del menú" width="941" height="1672" fetchpriority="high">
      </section>
      <section class="page" aria-label="Página 2 de 5: Salado">
        <img src="assets/Salado.jpg" alt="Menú de opciones saladas" width="941" height="1672">
      </section>
      <section class="page" aria-label="Página 3 de 5: Dulce">
        <img src="assets/dulce.jpg" alt="Menú de opciones dulces" width="941" height="1672">
      </section>
      <section class="page" aria-label="Página 4 de 5: Con helado, fotos">
        <img src="assets/con helado foto.jpg" alt="Fotos de opciones con helado" width="941" height="1672">
      </section>
      <section class="page" aria-label="Página 5 de 5: Con helado">
        <img src="assets/con helado.jpg" alt="Menú de opciones con helado" width="941" height="1672">
      </section>
    </div>

    <nav class="pagination" aria-label="Páginas del menú">
      <button class="dot active" type="button" aria-label="Ir a la página 1" aria-current="page"></button>
      <button class="dot" type="button" aria-label="Ir a la página 2"></button>
      <button class="dot" type="button" aria-label="Ir a la página 3"></button>
      <button class="dot" type="button" aria-label="Ir a la página 4"></button>
      <button class="dot" type="button" aria-label="Ir a la página 5"></button>
    </nav>
  </main>
  <script src="assets/app.js?v=2"></script>
</body>
</html>
